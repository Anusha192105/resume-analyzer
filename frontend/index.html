<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h2 {
            color: #333;
        }
        input, button {
            padding: 10px;
            margin: 10px 0;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 4px;
            display: none;
        }
        .error {
            color: #d32f2f;
        }
        .success {
            color: #388e3c;
        }
    </style>
</head>
<body>

<h2>Resume Analyzer</h2>

<input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt"><br>
<button onclick="upload()">Analyze</button>

<div id="result"></div>

<script>
function upload() {
    let file = document.getElementById("fileInput").files[0];
    let resultDiv = document.getElementById("result");

    if (!file) {
        alert("Please select a file");
        return;
    }

    let formData = new FormData();
    formData.append("resume", file);

    fetch("http://127.0.0.1:5000/analyze", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        resultDiv.innerHTML =
            "<span class='success'><strong>Analysis Results:</strong></span><br>" +
            "Skills: " + data.skills + "<br>" +
            "Score: " + data.score.total + "<br>" +
            "Best Job Match: " + data.best_match;
        resultDiv.style.display = "block";
    })
    .catch(err => {
        console.log(err);
        resultDiv.innerHTML = "<span class='error'>Error connecting to backend. Please try again.</span>";
        resultDiv.style.display = "block";
    });
}
</script>

</body>
</html>
